<title>Zrak · Golob predogled</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap">
<style>
/* Layout: controls on top (tasks done 0–4, theme), then four panels side by side: Igra hero with Golob in fog,
   the two widgets, Opozorila and Četrti with Golob's bubble. App palette (green Figma redesign). */
:root {
  --bg: #f5f5ed; --surface: #ffffff; --soft: #e8ede3; --text: #294b3d; --text-2: #5d7168; --accent: #476e57; --on-accent: #f9faf4;
  --hero-a: #2f5544; --hero-b: #577d61; --hero-text: #f5f5ed; --hero-text-2: #b9cdc4; --megla: #cfd8d6; --page: #d9e2d6;
  --dobro: #3bb273; --zmerno: #f2c94c; --slabo: #f2994a; --zeloslabo: #e5484d; --nevarno: #8e4ec6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #182f32; --surface: #244348; --soft: #2b4c4f; --text: #f5f5ed; --text-2: #b9cdc4; --accent: #b8d5a4; --on-accent: #182f32; --megla: #9fb3b0; --page: #0f2124; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #182f32; --surface: #244348; --soft: #2b4c4f; --text: #f5f5ed; --text-2: #b9cdc4; --accent: #b8d5a4; --on-accent: #182f32; --megla: #9fb3b0; --page: #0f2124; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; font-size: 17px; line-height: 1.3; padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
p, h1, h2, h3 { margin: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; margin-bottom: 18px; }
.controls label { display: flex; gap: 10px; align-items: center; background: var(--surface); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 15px; }
.controls input[type=range] { width: 160px; accent-color: var(--accent); }
.ctl { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 700; }
.ctl[aria-pressed='true'] { background: var(--accent); color: var(--on-accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 390px)); gap: 20px; justify-content: center; }
.panel { background: var(--bg); border-radius: 28px; padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel h2 { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.t-title { font-size: 32px; font-weight: 700; line-height: 1.15; }
.t-label { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; }
.t-small { font-size: 12px; color: var(--text-2); }
.card { background: var(--surface); border-radius: 20px; padding: 14px 16px; display: grid; gap: 8px; }

/* Golob in fog */
.golob-megla { position: relative; width: 230px; height: 262px; margin: 10px auto 0; display: grid; place-items: center; }
.golob-body { position: relative; width: 170px; height: 213px; perspective: 520px; transition: filter .6s; }
.golob-3d { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: idle 5s ease-in-out infinite; }
.golob-3d img { position: absolute; inset: 0; width: 100%; height: 100%; }
.shadow { position: absolute; left: 50%; bottom: 14px; width: 120px; height: 10px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgb(0 0 0 / .35), transparent); }
.megla { position: absolute; inset: -10px -10px; pointer-events: none; transition: opacity .6s; filter: blur(12px); }
.megla span { position: absolute; border-radius: 50%; background: var(--megla); }
.megla span:nth-child(1) { left: 0; top: 8%; width: 70%; height: 46%; animation: drift 9s ease-in-out infinite alternate; }
.megla span:nth-child(2) { right: 0; top: 36%; width: 72%; height: 44%; animation: drift 12s ease-in-out infinite alternate-reverse; }
.megla span:nth-child(3) { left: 10%; bottom: 0; width: 80%; height: 40%; animation: drift 15s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translateX(-12px); } to { transform: translateX(12px); } }
@keyframes idle { 0%, 100% { transform: rotateY(-9deg); } 50% { transform: rotateY(9deg) translateY(-5px); } }
.bubble { position: absolute; left: 50%; top: 0; transform: translateX(-50%); white-space: nowrap; font-size: 13px; font-weight: 700; background: var(--surface); color: var(--text); padding: 6px 12px; border-radius: 12px 12px 12px 3px; box-shadow: 0 2px 6px rgb(0 0 0 / .15); z-index: 2; }
.hero-line { text-align: center; color: var(--text-2); }
.drops { display: flex; gap: 6px; justify-content: center; }

/* Widgets (home screen, always dark green) */
.w22, .w42 { background: var(--hero-a); color: var(--hero-text); border-radius: 24px; padding: 16px; position: relative; }
.w22 { width: 170px; min-height: 170px; display: grid; align-content: start; gap: 6px; padding-bottom: 60px; }
.w42 { width: 340px; max-width: 100%; display: flex; gap: 12px; }
.w42-main { flex: 1; display: grid; align-content: start; gap: 8px; min-width: 0; }
.w42-side { display: grid; justify-items: center; align-content: end; font-size: 12px; color: var(--hero-text-2); text-align: center; gap: 4px; }
.w-verdict { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800; }
.w-ico { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 12px; background: var(--zmerno); color: #00303f; font-size: 13px; font-weight: 800; }
.w-pm b { font-size: 30px; font-weight: 800; line-height: 1; }
.w-pm { font-size: 14px; display: flex; align-items: baseline; gap: 6px; }
.w-small { font-size: 12px; opacity: .85; }
.w-scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; height: 8px; position: relative; }
.w-scale span { border-radius: 4px; opacity: .45; }
.w-scale span.on { opacity: 1; }
.w-scale i { position: absolute; top: -4px; left: 33%; width: 4px; height: 16px; border-radius: 2px; background: var(--hero-text); box-shadow: 0 0 0 2px var(--hero-a); }
.w-tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 8px; background: rgb(255 255 255 / .12); font-size: 11px; font-weight: 700; justify-self: start; }
.w-tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--hero-text); }
.w-golob { position: absolute; right: 8px; bottom: 6px; }
.w-tasks { font-size: 11px; color: var(--hero-text-2); }
.w-tasks.red { color: #ff9a9e; }

/* Golob reče */
.golob-rece { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.golob-bubble { background: var(--surface); color: var(--text); border-radius: 16px 16px 16px 4px; padding: 10px 14px; font-size: 15px; line-height: 1.3; box-shadow: 0 2px 6px rgb(0 0 0 / .12); }
.rows { display: grid; }
.row { height: 44px; border-radius: 12px; display: grid; grid-template-columns: 32px 1fr auto; align-items: center; padding: 0 12px; font-size: 16px; }
.row.me { background: var(--soft); font-weight: 700; }
.row .n { color: var(--text-2); font-weight: 700; }
.chip { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 700; margin-left: 8px; }
.setting { background: var(--surface); border-radius: 20px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.toggle { width: 52px; height: 32px; border-radius: 16px; border: none; background: var(--soft); position: relative; }
.toggle::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 12px; background: #fff; transition: left .15s; }
.toggle.on { background: var(--accent); }
.toggle.on::after { left: 24px; }
@media (prefers-reduced-motion: reduce) { .golob-3d, .megla span { animation: none; } }
</style>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React
const GOLOB = 'golob.png', GOLOB_RDECE = 'golob-rdece.png'

function Golob3D({ size = 170, red = false }) {
  const layers = 6
  return (
    <div className="golob-3d" style={{ width: size, height: size * 1.25 }}>
      {Array.from({ length: layers }, (_, i) => (
        <img key={i} src={red ? GOLOB_RDECE : GOLOB} alt="" draggable={false} style={{ transform: `translateZ(${(i - layers + 1) * 3}px)`, filter: i === layers - 1 ? 'none' : `brightness(${0.55 + (i / layers) * 0.35})` }} />
      ))}
    </div>
  )
}
function GolobMegla({ done }) {
  const fog = (4 - done) / 4
  const line = done === 4 ? 'Končno dihamo.' : done === 0 ? 'Kje si? Nič ne vidim.' : `Še ${4 - done} ${4 - done === 1 ? 'naloga' : 4 - done === 2 ? 'nalogi' : 'naloge'} in bo jasno.`
  return (
    <div className="golob-megla" role="img" aria-label={`Golob v megli, ${done} od 4 nalog`}>
      <span className="bubble">{line}</span>
      <div className="golob-body" style={{ filter: `blur(${(fog * 2.2).toFixed(1)}px) saturate(${1 - fog * 0.55}) brightness(${1 - fog * 0.15})` }}>
        <Golob3D />
      </div>
      <div className="shadow" />
      <div className="megla" style={{ opacity: fog * 0.96 }} aria-hidden="true"><span /><span /><span /></div>
    </div>
  )
}
function Drop({ filled }) {
  return <svg width="20" height="25" viewBox="0 0 20 25" aria-hidden="true"><path d="M10 1.5C10 1.5 2 10.5 2 16a8 8 0 0 0 16 0C18 10.5 10 1.5 10 1.5Z" fill={filled ? 'var(--accent)' : 'none'} stroke="var(--accent)" strokeWidth="1.8" /></svg>
}
function Scale() {
  return <div className="w-scale">{['var(--dobro)', 'var(--zmerno)', 'var(--slabo)', 'var(--zeloslabo)', 'var(--nevarno)'].map((c, i) => <span key={i} className={i === 1 ? 'on' : ''} style={{ background: c }} />)}<i /></div>
}
function Widgets({ done }) {
  const red = done < 4
  const left = 4 - done
  const tasks = left === 0 ? 'Vse naloge opravljene. Golob je miren.' : `Golob čaka: še ${left} ${left === 1 ? 'naloga' : left === 2 ? 'nalogi' : 'naloge'}`
  return (
    <>
      <div className="w22">
        <span className="w-verdict"><span className="w-ico">–</span>ZMERNO</span>
        <span className="w-pm"><b>21</b> µg/m³</span>
        <span className="w-small">fini delci PM2,5</span>
        <Scale />
        <span className="w-small">Zmerno = 9–35 µg/m³</span>
        <span className="w-tag"><i />MERITEV · Bežigrad</span>
        <img className="w-golob" src={red ? GOLOB_RDECE : GOLOB} width="46" height="58" alt={red ? 'Golob z rdečimi očmi' : 'Golob'} />
      </div>
      <div className="w42">
        <div className="w42-main">
          <span className="w-verdict"><span className="w-ico">–</span>ZMERNO</span>
          <span className="w-pm"><b>21</b> µg/m³ <span className="w-small">· zmerno je 9–35</span></span>
          <Scale />
          <span style={{ fontSize: 14 }}>Za občutljive: krajši sprehod do 18h.</span>
          <span className="w-tag"><i />MERITEV · Bežigrad · 14:00</span>
        </div>
        <div className="w42-side">
          <img src={red ? GOLOB_RDECE : GOLOB} width="64" height="80" alt={red ? 'Golob z rdečimi očmi' : 'Golob'} />
          <span className={`w-tasks${red ? ' red' : ''}`}>{tasks}</span>
        </div>
      </div>
    </>
  )
}
function GolobRece({ text }) {
  return <div className="golob-rece"><img src={GOLOB} width="72" height="90" alt="" /><p className="golob-bubble">{text}</p></div>
}

const CETRTI = [['Šmarna gora', 12], ['Rožnik', 14], ['Dravlje', 15], ['Sostro', 16], ['Šentvid', 18], ['Golovec', 19], ['Posavje', 20], ['Črnuče', 22], ['Rudnik', 25], ['Šiška', 27], ['Center', 30], ['Bežigrad', 33], ['Polje', 35], ['Jarše', 35], ['Vič', 40], ['Moste', 41], ['Trnovo', 58]]
function App() {
  const [done, setDone] = useState(0)
  const [dark, setDark] = useState(() => matchMedia('(prefers-color-scheme: dark)').matches)
  const [mine, setMine] = useState('Bežigrad')
  const [airing, setAiring] = useState(true)
  const [evening, setEvening] = useState(false)
  useEffect(() => { document.documentElement.dataset.theme = dark ? 'dark' : 'light' }, [dark])
  const myIdx = CETRTI.findIndex(([n]) => n === mine)
  const golobCetrt = myIdx < 5
    ? `${mine} je med petimi najčistejšimi. Tukaj bi gnezdil tudi jaz.`
    : `${mine} je ${myIdx + 1}. od vrha? Jaz bi se preselil. Hecam se. Malo.`
  const golobOpoz = airing && evening ? 'Oglasim se samo dvakrat: ko je vredno odpreti okno in večer pred slabim dnem. Drugače molčim.'
    : airing ? 'Povem ti, kdaj odpreti okno. Ne prej, ne pozneje. Golobi imamo nos za to.'
    : evening ? 'Večer pred slabim dnem ti pošljem opozorilo. Brez panike, samo načrtuj sprehod.'
    : 'Vse izklopljeno? Prav. Golobi znamo biti tiho. Skoraj.'
  return (
    <>
      <div className="controls">
        <label>Opravljene naloge: {done} od 4 <input type="range" min="0" max="4" value={done} onChange={(e) => setDone(Number(e.target.value))} aria-label="Opravljene naloge" /></label>
        <label>Tvoja četrt <select value={mine} onChange={(e) => setMine(e.target.value)} style={{ font: 'inherit' }}>{CETRTI.map(([n]) => <option key={n}>{n}</option>)}</select></label>
        <button className="ctl" aria-pressed={dark} onClick={() => setDark(!dark)}>{dark ? 'Temni način' : 'Svetli način'}</button>
      </div>
      <div className="grid">
        <section className="panel">
          <h2>Igra · namesto pljuč in rastline</h2>
          <p className="t-label">Vsak dan štiri naloge</p>
          <p className="t-title">Igra</p>
          <GolobMegla done={done} />
          <p className="hero-line">{done === 0 ? 'Golob je v megli. Vsaka naloga razkadi del megle.' : done === 4 ? 'Megla se je razkadila. Golob diha čist zrak.' : 'Megla se redči z vsako opravljeno nalogo.'}</p>
          <div className="card"><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><b style={{ fontSize: 20 }}>Danes: {done} od 4</b><span className="drops">{[0, 1, 2, 3].map((i) => <Drop key={i} filled={i < done} />)}</span></div></div>
        </section>
        <section className="panel">
          <h2>Pripomočka · rdeče oči, dokler naloge čakajo</h2>
          <Widgets done={done} />
        </section>
        <section className="panel">
          <h2>Četrti · Golob malce pametuje</h2>
          <p className="t-label">Ljubljana · od najčistejše do najbolj onesnažene</p>
          <p className="t-title">Četrti</p>
          <GolobRece text={golobCetrt} />
          <div className="rows">
            {CETRTI.slice(0, 12).map(([n, v], i) => <div key={n} className={`row${n === mine ? ' me' : ''}`}><span className="n">{i + 1}</span><span>{n}{n === mine && <span className="chip">tvoja četrt</span>}</span><span>{v} µg/m³</span></div>)}
            <p className="t-small" style={{ padding: '8px 12px' }}>… do 17. mesta</p>
          </div>
        </section>
        <section className="panel">
          <h2>Opozorila · Golob pove, kdaj se oglasi</h2>
          <p className="t-label">Po tvojem ritmu</p>
          <p className="t-title">Opozorila</p>
          <GolobRece text={golobOpoz} />
          <div className="setting"><b>Obvesti me, ko je priporočljivo prezračiti</b><button className={`toggle${airing ? ' on' : ''}`} aria-pressed={airing} aria-label="Zračenje" onClick={() => setAiring(!airing)} /></div>
          <div className="setting"><b>Opozori me večer pred slabim dnem</b><button className={`toggle${evening ? ' on' : ''}`} aria-pressed={evening} aria-label="Večer prej" onClick={() => setEvening(!evening)} /></div>
        </section>
      </div>
    </>
  )
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />)
</script>
